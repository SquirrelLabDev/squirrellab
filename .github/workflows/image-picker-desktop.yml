name: Build image-picker-desktop

on:
  push:
    branches: [main]
    paths:
      - 'apps/image-picker-desktop/**'
      - '.github/workflows/image-picker-desktop.yml'
    tags:
      - 'image-picker-desktop-v*'
  pull_request:
    paths:
      - 'apps/image-picker-desktop/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/image-picker-desktop

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: image-picker-desktop-windows
            binary: src-tauri/target/release/SquirrellabImages.exe
            release_name: SquirrellabImages.exe
          - os: macos-latest
            artifact: image-picker-desktop-macos
            binary: src-tauri/target/release/SquirrellabImages
            release_name: SquirrellabImages-macos
          - os: ubuntu-latest
            artifact: image-picker-desktop-linux
            binary: src-tauri/target/release/SquirrellabImages
            release_name: SquirrellabImages-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux webview dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/image-picker-desktop/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build portable executable
        run: npm run build -- --no-bundle

      - name: Stage release binary
        shell: bash
        run: |
          mkdir -p release
          cp "${{ matrix.binary }}" "release/${{ matrix.release_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/image-picker-desktop/release/${{ matrix.release_name }}

  release:
    if: startsWith(github.ref, 'refs/tags/image-picker-desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
