[package]
name = "image-picker-desktop"
version = "0.1.0"
description = "Distributeur d'images — tirage au sort hors ligne"
authors = ["SquirrelLab"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
