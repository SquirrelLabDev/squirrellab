[package]
name = "token-manager-desktop"
version = "0.1.0"
description = "Gestionnaire de tokens — version portable"
authors = ["SquirrelLab"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "token-manager-desktop"
path = "src/main.rs"
